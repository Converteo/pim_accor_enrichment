# Enrichment Factory pipeline, started by each scraping deposit (load function) and every 15 minutes (scheduler).
#
#   1. extract the PIM, only for a run started by a scraping deposit (argument source) or asked for (extract: true);
#      the job reuses an extraction that finished after the deposit (deposited_at) and waits for a running one
#   2. deterministic matching (brick 1)
#   3. judge agent (brick 2): only matches not judged yet
#   4. enrichment agent (brick 3): one execution per family folder of the prompts bucket, for the validated matches only
# Matches waiting for a human decision (a_valider) are not enriched: the scheduler run picks them up once decided.
#
# Arguments (all optional): {"source": "...", "depot_id": "...", "deposited_at": "<ISO 8601>", "extract": true,
#                             "skip_extract": true, "priorites": "P1,P2,P3"}
# The scheduler and manual runs work on the PIM already in BigQuery: the PIM API is only called for new scrapings.
# Env (set by cloudbuild.yaml): EXTRACT_JOB, MATCHING_JOB, JUDGE_JOB, ENRICH_JOB, PROMPTS_BUCKET
main:
  params: [args]
  steps:
    # args is null when the workflow is run without arguments (args itself cannot be reassigned)
    - init:
        assign:
          - input: {}
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - jobs_root: ${"projects/" + project + "/locations/" + sys.get_env("GOOGLE_CLOUD_LOCATION") + "/jobs/"}
          - bucket: ${sys.get_env("PROMPTS_BUCKET")}
          - familles: []
          - failures: []

    - read_args:
        switch:
          - condition: ${args != null}
            assign:
              - input: ${args}

    - settings:
        assign:
          - extract: ${default(map.get(input, "extract"), map.get(input, "source") != null) and not default(map.get(input, "skip_extract"), false)}
          - deposited_at: ${default(map.get(input, "deposited_at"), "")}
          - priorites: ${default(map.get(input, "priorites"), "P1,P2,P3")}

    - log_start:
        call: sys.log
        args:
          severity: INFO
          json:
            message: "Pipeline started"
            args: ${input}

    - extract_pim:
        switch:
          - condition: ${extract}
            steps:
              - run_extract:
                  call: googleapis.run.v2.projects.locations.jobs.run
                  args:
                    name: ${jobs_root + sys.get_env("EXTRACT_JOB")}
                    body:
                      overrides:
                        containerOverrides:
                          - env:
                              - name: DEPOSITED_AT
                                value: ${deposited_at}
                    connector_params:
                      timeout: 7200

    - matching:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${jobs_root + sys.get_env("MATCHING_JOB")}
          connector_params:
            timeout: 3600

    - judge:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${jobs_root + sys.get_env("JUDGE_JOB")}
          connector_params:
            timeout: 3600

    - list_familles:
        call: googleapis.storage.v1.objects.list
        args:
          bucket: ${bucket}
          prefix: "enrichment/"
          delimiter: "/"
        result: listing

    - collect_familles:
        for:
          value: prefix
          in: ${default(map.get(listing, "prefixes"), [])}
          steps:
            - add_famille:
                assign:
                  - parts: ${text.split(prefix, "/")}
                  - familles: ${list.concat(familles, parts[1])}

    - enrich:
        parallel:
          shared: [failures]
          # Families enriched at the same time (each is one Cloud Run job execution)
          concurrency_limit: 3
          for:
            value: famille
            in: ${familles}
            steps:
              - run_enrich:
                  try:
                    call: googleapis.run.v2.projects.locations.jobs.run
                    args:
                      name: ${jobs_root + sys.get_env("ENRICH_JOB")}
                      body:
                        overrides:
                          containerOverrides:
                            - env:
                                - name: FAMILLE
                                  value: ${famille}
                                - name: PRIORITES
                                  value: ${priorites}
                      connector_params:
                        timeout: 3600
                  except:
                    as: e
                    steps:
                      - record_failure:
                          assign:
                            - failure:
                                famille: ${famille}
                                error: ${e}
                            - failures: ${list.concat(failures, failure)}

    - report:
        switch:
          - condition: ${len(failures) > 0}
            raise:
              message: "Enrichment failed for some families"
              failures: ${failures}

    - done:
        return:
          familles: ${familles}
