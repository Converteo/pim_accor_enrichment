# Enrichment Factory pipeline, started by each scraping deposit (load function) and every 15 minutes (scheduler).
#
#   1. extract the PIM (skipped by the job when the last extraction is recent, or when skip_extract is true)
#   2. deterministic matching (brick 1)
#   3. judge agent (brick 2): only matches not judged yet
#   4. enrichment agent (brick 3): one execution per family folder of the prompts bucket, for the validated matches only
# Matches waiting for a human decision (a_valider) are not enriched: the scheduler run picks them up once decided.
#
# Arguments (all optional): {"source": "...", "depot_id": "...", "skip_extract": true, "priorites": "P1,P2,P3"}
# Env (set by cloudbuild.yaml): EXTRACT_JOB, MATCHING_JOB, JUDGE_JOB, ENRICH_JOB, PROMPTS_BUCKET
main:
  params: [args]
  steps:
    - init:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - jobs_root: ${"projects/" + project + "/locations/" + sys.get_env("GOOGLE_CLOUD_LOCATION") + "/jobs/"}
          - bucket: ${sys.get_env("PROMPTS_BUCKET")}
          - skip_extract: ${default(map.get(args, "skip_extract"), false)}
          - priorites: ${default(map.get(args, "priorites"), "P1,P2,P3")}
          - familles: []
          - failures: []

    - log_start:
        call: sys.log
        args:
          severity: INFO
          json:
            message: "Pipeline started"
            args: ${args}

    - extract_pim:
        switch:
          - condition: ${not skip_extract}
            steps:
              - run_extract:
                  call: googleapis.run.v2.projects.locations.jobs.run
                  args:
                    name: ${jobs_root + sys.get_env("EXTRACT_JOB")}
                    connector_params:
                      timeout: 7200

    - matching:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${jobs_root + sys.get_env("MATCHING_JOB")}
          connector_params:
            timeout: 3600

    - judge:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${jobs_root + sys.get_env("JUDGE_JOB")}
          connector_params:
            timeout: 3600

    - list_familles:
        call: googleapis.storage.v1.objects.list
        args:
          bucket: ${bucket}
          prefix: "enrichment/"
          delimiter: "/"
        result: listing

    - collect_familles:
        for:
          value: prefix
          in: ${default(map.get(listing, "prefixes"), [])}
          steps:
            - add_famille:
                assign:
                  - parts: ${text.split(prefix, "/")}
                  - familles: ${list.concat(familles, parts[1])}

    - enrich:
        parallel:
          shared: [failures]
          # Families enriched at the same time (each is one Cloud Run job execution)
          concurrency_limit: 3
          for:
            value: famille
            in: ${familles}
            steps:
              - run_enrich:
                  try:
                    call: googleapis.run.v2.projects.locations.jobs.run
                    args:
                      name: ${jobs_root + sys.get_env("ENRICH_JOB")}
                      body:
                        overrides:
                          containerOverrides:
                            - env:
                                - name: FAMILLE
                                  value: ${famille}
                                - name: PRIORITES
                                  value: ${priorites}
                      connector_params:
                        timeout: 3600
                  except:
                    as: e
                    steps:
                      - record_failure:
                          assign:
                            - failure:
                                famille: ${famille}
                                error: ${e}
                            - failures: ${list.concat(failures, failure)}

    - report:
        switch:
          - condition: ${len(failures) > 0}
            raise:
              message: "Enrichment failed for some families"
              failures: ${failures}

    - done:
        return:
          familles: ${familles}
