# Pipeline de déploiement applicatif (CI/CD).
#
# Lancé par GitHub Actions (.github/workflows/deploy.yml) avec `gcloud builds submit` :
#   push sur la branche dev → environnement dev
#   push sur la branche stg → environnement stg
#
# Substitutions fournies par le workflow :
#   _ENV            dev | stg
#   _REGION         europe-west1
#   _AR_PATH        europe-west1-docker.pkg.dev/<projet>/ar-cvto-accor-pim-enrichment-<env>-euw1-docker
#   _FRONT_SERVICE  gcr-cvto-accor-pim-enrichment-<env>-euw1-front
#   _BACK_SERVICE   gcr-cvto-accor-pim-enrichment-<env>-euw1-back
#   _TAG            7 premiers caractères du commit (tag de l'image)
#   _BASE           cvto-accor-pim-enrichment-<env>-euw1 (noms des ressources du pipeline)

steps:
  # ---------- Frontend ----------
  - id: front-build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_AR_PATH}/frontend:${_TAG}
      - --tag=${_AR_PATH}/frontend:${_ENV}
      - frontend

  - id: front-push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_AR_PATH}/frontend"]

  - id: front-deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_FRONT_SERVICE}
      - --image=${_AR_PATH}/frontend:${_TAG}
      - --region=${_REGION}
      - --quiet

  # ---------- Backend (seulement si backend/Dockerfile existe) ----------
  - id: back-tests
    name: node:24-alpine
    waitFor: ["-"] # démarre en parallèle du frontend
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        if [ -f backend/Dockerfile ]; then
          cd backend && npm ci && npm run lint && npm test
        else
          echo "Pas de backend/Dockerfile : tests backend ignorés."
        fi

  - id: back-build-push
    name: gcr.io/cloud-builders/docker
    waitFor: ["back-tests"]
    entrypoint: bash
    args:
      - -c
      - |
        if [ -f backend/Dockerfile ]; then
          docker build --tag=${_AR_PATH}/backend:${_TAG} --tag=${_AR_PATH}/backend:${_ENV} backend
          docker push --all-tags ${_AR_PATH}/backend
        else
          echo "Pas de backend/Dockerfile : étape backend ignorée."
        fi

  - id: back-deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: ["back-build-push"]
    entrypoint: bash
    args:
      - -c
      - |
        if [ -f backend/Dockerfile ]; then
          gcloud run deploy ${_BACK_SERVICE} --image=${_AR_PATH}/backend:${_TAG} --region=${_REGION} --quiet
        else
          echo "Pas de backend/Dockerfile : déploiement backend ignoré."
        fi

  # ---------- Pipeline d'enrichissement (pipeline/, ressources : terraform/core/pipeline.tf) ----------
  - id: pipeline-tests
    name: python:3.11-slim
    waitFor: ["-"] # démarre en parallèle du frontend
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install --quiet --root-user-action=ignore \
          -r pipeline/jobs/src/requirements.txt -r pipeline/load-bq/src/requirements.txt pytest
        python -m pytest -q pipeline/jobs/tests pipeline/load-bq/tests
        python pipeline/tools/check_prompts.py pipeline/prompts

  - id: pipeline-build-push
    name: gcr.io/cloud-builders/docker
    waitFor: ["pipeline-tests"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # Une image pour les 5 jobs (pipeline/jobs), une pour le service de chargement (pipeline/load-bq)
        docker build --tag=${_AR_PATH}/pipeline:${_TAG} --tag=${_AR_PATH}/pipeline:${_ENV} pipeline/jobs/src
        docker build --tag=${_AR_PATH}/load-bq:${_TAG} --tag=${_AR_PATH}/load-bq:${_ENV} pipeline/load-bq/src
        docker push --all-tags ${_AR_PATH}/pipeline
        docker push --all-tags ${_AR_PATH}/load-bq

  - id: pipeline-deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: ["pipeline-build-push"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # Jobs et service : seule l'image change, leur configuration reste dans Terraform
        for job in extract-pim matching judge enrich export; do
          gcloud run jobs update gcrj-${_BASE}-$$job --image=${_AR_PATH}/pipeline:${_TAG} --region=${_REGION} --quiet
        done
        gcloud run deploy gcr-${_BASE}-load-bq --image=${_AR_PATH}/load-bq:${_TAG} --region=${_REGION} --quiet

        gcloud workflows deploy wf-${_BASE}-enrichment \
          --source=pipeline/workflow/workflow.yaml --location=${_REGION} \
          --service-account=sa-${_ENV}-workflows@${PROJECT_ID}.iam.gserviceaccount.com \
          --set-env-vars=EXTRACT_JOB=gcrj-${_BASE}-extract-pim,MATCHING_JOB=gcrj-${_BASE}-matching,JUDGE_JOB=gcrj-${_BASE}-judge,ENRICH_JOB=gcrj-${_BASE}-enrich,PROMPTS_BUCKET=bkt-${_BASE}-prompts \
          --quiet

        # Prompts : copie exacte de pipeline/prompts (un fichier retiré du repo est retiré du bucket)
        gcloud storage rsync pipeline/prompts gs://bkt-${_BASE}-prompts --recursive --delete-unmatched-destination-objects

options:
  # Obligatoire avec un service account dédié : les logs vont dans Cloud Logging
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
