services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: pim-accor-frontend:local
    container_name: pim-accor-frontend
    environment:
      PORT: "8080"
    ports:
      # Host port configurable: FRONTEND_PORT=xxxx docker compose up -d
      - "${FRONTEND_PORT:-8080}:8080"
    restart: unless-stopped
